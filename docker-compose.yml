services:
  # MySQL Database (Lab 1 - Primary database)
  mysql:
    image: mysql:8.0
    container_name: airbnb-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: Lappy1234567890
      MYSQL_DATABASE: airbnb_db
    ports:
      - "3307:3306"  # Use 3307 externally to avoid conflict with local MySQL
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    networks:
      - airbnb-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pLappy1234567890"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MongoDB Database (Lab 2 - For session storage)
  mongodb:
    image: mongo:7.0
    container_name: airbnb-mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: airbnb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - airbnb-network

  # Zookeeper (Lab 2 - Required for Kafka)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: airbnb-zookeeper
    restart: always
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - airbnb-network

  # Kafka (Lab 2 - Message broker for async booking events)
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: airbnb-kafka
    restart: always
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9093:9093"  # External access
    networks:
      - airbnb-network

  # Backend Service (Lab 1 + Lab 2)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: airbnb-backend
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
      mongodb:
        condition: service_started
      kafka:
        condition: service_started
    ports:
      - "5001:5000"  # External 5001, Internal 5000
    environment:
      NODE_ENV: production
      PORT: 5000
      # MySQL (Lab 1 - Primary database)
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: Lappy1234567890
      DB_NAME: airbnb_db
      # MongoDB (Lab 2 - Session storage)
      MONGODB_URI: mongodb://admin:admin123@mongodb:27017/airbnb?authSource=admin
      # Kafka (Lab 2 - Async messaging)
      KAFKA_BROKER: kafka:9092
      # Session
      SESSION_SECRET: cmpe273_airbnb_secret_key_2024
    volumes:
      - ./backend/uploads:/app/uploads
    networks:
      - airbnb-network

  # Frontend Service (Lab 1 + Lab 2)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # No REACT_APP_API_URL - use relative URLs with nginx proxy
    container_name: airbnb-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3001:80"  # External 3001, Internal 80 (nginx)
    networks:
      - airbnb-network

networks:
  airbnb-network:
    driver: bridge

volumes:
  mysql_data:
  mongodb_data:
